name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Never include your API key** in an issue.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the task or workflow that is difficult today, including whether you use the CLI interactively, in CI, or from a coding agent.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: The command, flags, output, or behavior you would like to see. Example invocations help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, if any
