name: Release

# Publishes @uptimerobot/cli to npm when a GitHub Release is published.
#
# Authentication is npm Trusted Publishing (OIDC): no tokens are stored
# anywhere. npm verifies this workflow's identity and attaches a provenance
# attestation that cryptographically links the published tarball to this
# repository, commit, and workflow run.
#
# Release flow: bump the version and update CHANGELOG.md on `main`, then publish
# a GitHub Release for tag vX.Y.Z. That event triggers this workflow.
#
# Build and publish are deliberately separate jobs. Dependency install and the
# build run in `build`, which has NO id-token, so no third-party code executes
# while the OIDC publish credential exists. Only `publish` holds id-token:write,
# and it installs nothing — it publishes the prebuilt artifact with scripts off.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.26.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm openapi:check

  build:
    name: Build release artifact
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Release commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main \
            || { echo "::error::release commit ${{ github.sha }} is not on main; releases must be cut from main"; exit 1; }

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.26.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$ver" != "$pkg" ]; then
            echo "::error::release tag $TAG does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm build

      - name: Upload built dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest # trusted publishing requires a cloud-hosted runner
    environment: release # approval gate; add reviewers in repo settings
    permissions:
      id-token: write # OIDC: trusted publishing + provenance
      contents: read
    steps:
      # Only the repo's own tracked files (package.json, bin/, README, LICENSE,
      # openapi/) plus the prebuilt dist/ artifact are present here. No
      # dependency install and no build run in this job, so nothing untrusted
      # executes while the OIDC publish credential is live.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x # >= 22.14 required for OIDC
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pin it so a toolchain bump can't
      # break release day; bump this line deliberately.
      - name: Pin an OIDC-capable npm
        run: npm install -g npm@11.6.2 --ignore-scripts

      - name: Download built dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # --ignore-scripts skips the prepack build (dist/ is already built and
      # downloaded above). No NODE_AUTH_TOKEN: OIDC supplies a short-lived,
      # workflow-scoped credential and attaches provenance automatically;
      # publishConfig already forces public access and the npmjs registry.
      # A GitHub pre-release publishes to the `next` dist-tag so it never
      # becomes the default `latest` that a bare `npm install` resolves to.
      - name: Publish to npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag=latest
          if [ "$PRERELEASE" = "true" ]; then tag=next; fi
          echo "Publishing @uptimerobot/cli to dist-tag: $tag"
          npm publish --provenance --access public --ignore-scripts --tag "$tag"
