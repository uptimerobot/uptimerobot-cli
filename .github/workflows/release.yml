name: Release

# Publishes @uptimerobot/cli to npm when a GitHub Release is published.
#
# Authentication is npm Trusted Publishing (OIDC): no tokens are stored
# anywhere. npm verifies this workflow's identity and attaches a provenance
# attestation that cryptographically links the published tarball to this
# repository, commit, and workflow run.
#
# Release flow: bump the version and update CHANGELOG.md on `main`, then publish
# a GitHub Release for tag vX.Y.Z. That event triggers this workflow, which
# re-verifies the released commit and publishes it to npm.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm openapi:check

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest # trusted publishing requires a cloud-hosted runner
    environment: release # optional approval gate; add reviewers in repo settings
    permissions:
      id-token: write # OIDC: trusted publishing + provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x # >= 22.14 required for OIDC
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pin it so a toolchain bump can't
      # break release day; bump this line deliberately.
      - name: Pin an OIDC-capable npm
        run: npm install -g npm@11.6.2

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$ver" != "$pkg" ]; then
            echo "::error::release tag $TAG does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm build

      # No NODE_AUTH_TOKEN: OIDC supplies a short-lived, workflow-scoped
      # credential and attaches provenance automatically. publishConfig in
      # package.json already forces public access and the npmjs registry.
      - name: Publish to npm
        run: npm publish --provenance --access public
