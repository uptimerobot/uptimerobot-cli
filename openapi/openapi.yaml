                    type: string
                  android_push_down_channel:
                    type: string
                nullable: true
            required:
              - id
              - friendlyName
              - type
              - value
              - customValue
              - enableNotificationsFor
              - sslExpirationReminder
              - httpUsername
              - httpPassword
              - authType
              - mobileProviderId
              - status
              - orgAlertContactId
      required:
        - nextLink
        - data
    AlertContactConfigDto:
      type: object
      properties:
        android_push_up_channel:
          type: string
        android_push_down_channel:
          type: string
    CreatePersonalAlertContactDto:
      type: object
      properties:
        type:
          enum:
            - Email
            - ProSms
            - Voice
            - MobileAppOld
            - MobileApp
          type: string
          description: >-
            Personal alert-contact type. Email and push (MobileAppOld/MobileApp)
            are creatable here; Pro SMS and voice require phone verification.
        friendlyName:
          type: string
          description: Display name of the alert contact
        enableNotificationsFor:
          enum:
            - 0
            - 1
            - 2
            - 3
          type: number
        value:
          type: string
          description: Email address (required for Email contacts)
        deviceName:
          type: string
          description: Device name (push)
        oneSignalSubscriptionId:
          type: string
          description: OneSignal subscription ID (push)
        oneSignalUserId:
          type: string
          description: OneSignal user ID (push)
        deviceFingerprint:
          type: string
          description: Device fingerprint (push)
        pushToken:
          type: string
          description: Push notification token (push)
        platform:
          type: string
          enum:
            - ios
            - android
          description: Device platform (push)
        config:
          $ref: '#/components/schemas/AlertContactConfigDto'
      required:
        - type
    UpdatePersonalAlertContactDto:
      type: object
      properties:
        friendlyName:
          type: string
          description: Display name of the personal alert contact
          example: My work email
        enableNotificationsFor:
          enum:
            - 0
            - 1
            - 2
            - 3
          type: number
          description: Which monitor events this contact is notified for
        sslExpirationReminder:
          type: boolean
          description: Whether to send SSL certificate expiration reminders
        isActive:
          type: boolean
          description: Activate (true) or pause (false) the alert contact
