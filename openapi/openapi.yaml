info:
  title: UptimeRobot API
  description: ''
  version: '3.0'
  contact: {}
tags:
  - name: Monitors
    description: ''
  - name: Public Status Pages
    description: ''
  - name: Maintenance Windows
    description: ''
  - name: User
    description: ''
  - name: Integrations
    description: ''
servers:
  - url: https://api.uptimerobot.com/v3
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: >-
        Enter your API token (without the "Bearer" prefix — it is added
        automatically).
  schemas:
    PublicBulkPauseDto:
      type: object
      properties:
        groupId:
          type: number
          minimum: 0
          description: >-
            ID of the monitor group to filter by (0 = default group / ungrouped
            monitors). At least one of groupId or tagId must be provided.
          example: 1
        tagId:
          type: number
          minimum: 1
          description: >-
            ID of the tag to filter by. At least one of groupId or tagId must be
            provided. When both groupId and tagId are specified, only monitors
            matching both filters are affected.
          example: 42
    BulkOperationResponseDto:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              monitorId:
                type: number
              monitorName:
                type: string
              status:
                type: string
                enum:
                  - success
                  - error
