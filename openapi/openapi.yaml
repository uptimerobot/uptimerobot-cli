      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
                minimum: 0
                exclusiveMinimum: false
              name:
                type: string
                minLength: 1
            required:
              - id
              - name
        nextCursorId:
          type: number
          nullable: true
      required:
        - data
        - nextCursorId
