    AlertContactSettings:
      type: object
      properties:
        alertContactId:
          type: number
          description: ID of the alert contact to notify
          example: 12345
        threshold:
          type: number
          description: Delay of notification in minutes, after the monitor is down
          example: 5
        recurrence:
          type: number
          description: Repeat notifications every X minutes
          example: 30
      required:
        - alertContactId
        - threshold
        - recurrence
    HttpKeywordMonitorConfigDto:
      type: object
      properties:
        sslExpirationPeriodDays:
          maxItems: 10
          description: SSL expiration period in days (0-365, max 10 items)
          example:
            - 7
            - 14
            - 30
          type: array
          items:
            type: number
            maximum: 365
            minimum: 0
        ipVersion:
          type: string
          enum:
            - ipv4Only
            - ipv6Only
          description: >-
            IP version preference. Omit for default behavior (IPv4 priority,
            falls back to IPv6)
          example: ipv4Only
        applicationErrorRetries:
          type: number
          minimum: 0
          maximum: 3
          description: >-
            Number of retries on application errors (HTTP 4xx/5xx). 0-3.
            Connection errors always retry 3 times regardless of this setting.
          example: 1
    CreateHttpMonitorDto:
      type: object
      properties:
        friendlyName:
          type: string
          example: My monitor
          description: Friendly name of the monitor
          maxLength: 250
        interval:
          type: number
          example: 60
          minimum: 30
          description: Interval of check in seconds
        assignedAlertContacts:
          description: >-
            Alert contacts to be assigned to the monitor. Threshold and
            recurrence are only available in the paid plans, they are always 0
            in the Free Plan
          type: array
          items:
            $ref: '#/components/schemas/AlertContactSettings'
        tagNames:
          example:
            - tag1
            - tag2
          description: Tags to be assigned to the monitor
          type: array
          items:
            type: string
        maintenanceWindowsIds:
          example:
            - 123
            - 234
          description: Maintenance windows to be assigned to the monitor
          type: array
          items:
            type: number
        regionData:
          description: >-
            Regional data for monitoring. Omit it, or send it without REGION,
            and the region is assigned automatically (currently NA or EU, one
            region per organization) and never changed on edit.
          allOf:
            - $ref: '#/components/schemas/RegionalDataDto'
        regionalData:
          enum:
            - na
            - eu
            - as
            - oc
          type: string
          example: na
          deprecated: true
          description: >-
            Region for monitoring: na (North America), eu (Europe), as (Asia),
            oc (Oceania). Note: If both regionalData and regionData are
            provided, regionData takes priority.
        responseTimeThreshold:
          type: number
          minimum: 0
          maximum: 60000
          description: >-
            Response time threshold in milliseconds. When provided, the value is
            applied to all active regions as regionData.THRESHOLD. Always
            returns 0 — use regionData.THRESHOLD for per-region control.
        groupId:
          type: number
          example: 0
          minimum: 0
          description: Monitor group ID to assign the monitor to. Default is 0 (no group).
        customFields:
          type: object
          additionalProperties:
            type: string
          example:
            environment: production
            team: platform
          description: >-
            Custom key-value metadata for the monitor. Max 20 keys. Keys:
            alphanumeric + underscore + hyphen, max 64 chars. Values: max 255
            chars. Paid plans only.
        httpMethodType:
          type: string
          enum:
            - HEAD
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - QUERY
          example: HEAD
          description: >-
            HTTP method to use for the request. For HTTP and Keyword monitors it
            defaults to HEAD if omitted
        authType:
          type: string
          enum:
            - NONE
            - HTTP_BASIC
            - DIGEST
            - BEARER
          example: NONE
          description: Authentication method to use for the request
        httpUsername:
          type: string
          example: admin
          maxLength: 255
          description: Username for HTTP Basic authentication
        httpPassword:
          type: string
          example: password
          maxLength: 255
          description: Password for HTTP Basic authentication
        postValueData:
          oneOf:
            - type: string
            - type: object
          description: >-
            Data to be sent in the request. Not applicable for HTTP method type
            = HEAD. Can be a JSON object or string
        postValueType:
          enum:
            - KEY_VALUE
            - RAW_JSON
          type: string
          example: RAW_JSON
          description: >-
            Type of data payload to be sent in the request. Affects what data is
            accepted by "postValueData" field
        customHttpHeaders:
          type: object
          additionalProperties:
            type: string
          example:
            X-Custom-Header: value
          description: >-
            Custom HTTP headers to be sent in the request. Must be sent as JSON
            object with key-value pairs. The serialized JSON must not exceed
            3000 characters
        successHttpResponseCodes:
          example:
            - 2xx
            - 3xx
          description: >-
            Success HTTP response codes. Can contain specific codes or ranges
            like 2xx. Default is [2xx, 3xx]
          type: array
          items:
            type: string
        checkSSLErrors:
          type: boolean
          description: Whether to check for SSL and domain expiration errors
        sslExpirationReminder:
          type: boolean
          description: >-
            Whether to send a notification when the SSL certificate is about to
            expire
        domainExpirationReminder:
          type: boolean
          description: Whether to send a notification when the domain is about to expire
        followRedirections:
          type: boolean
          description: Whether to follow redirections
        type:
          type: string
          enum:
            - HTTP
          example: HTTP
        url:
          type: string
          example: https://example.com
          maxLength: 10000
          description: URL of the monitor
        timeout:
          type: number
          example: 30
          minimum: 0
          maximum: 60
          description: Timeout of check in seconds
        config:
          description: >-
            Optional HTTP monitor configuration: ipVersion,
            sslExpirationPeriodDays, applicationErrorRetries
          allOf:
            - $ref: '#/components/schemas/HttpKeywordMonitorConfigDto'
      required:
        - friendlyName
        - interval
        - type
        - url
        - timeout
