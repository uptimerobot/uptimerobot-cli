    PageCustomSettingsDto:
      type: object
      properties:
        layout:
          enum:
            - LogoOnLeft
            - LogoOnCenter
          type: string
          example: logo_on_center
          title: Logo alignment
          description: The alignment of the logo on the page
        theme:
          enum:
            - Light
            - Dark
          type: string
          example: light
          title: Theme
          description: The theme of the page
        density:
          enum:
            - Normal
            - Compact
          type: string
          example: normal
          title: Density
          description: The density of the page
        showMonitorsUnderGroups:
          type: boolean
          example: false
          title: Show monitors under their groups
          description: >-
            Group the monitors on the status page home screen under their
            monitor groups instead of listing them flat. Omit it to keep the
            current value.
    ColorsCustomSettingsDto:
      type: object
      properties:
        main:
          type: string
          pattern: ^#?([0-9A-F]{3}|[0-9A-F]{4}|[0-9A-F]{6}|[0-9A-F]{8})$
          example: '#131a26'
          description: The main color of the page in hex format
        text:
          type: string
          pattern: ^#?([0-9A-F]{3}|[0-9A-F]{4}|[0-9A-F]{6}|[0-9A-F]{8})$
          example: '#ffffff'
          description: The text color of the page in hex format
        link:
          type: string
          pattern: ^#?([0-9A-F]{3}|[0-9A-F]{4}|[0-9A-F]{6}|[0-9A-F]{8})$
          example: '#3bd671'
          description: The link color of the page in hex format
    FeaturesCustomSettingsDto:
      type: object
      properties:
        showBars:
          type: boolean
          example: false
          title: Show bar charts
          description: >-
            Show or hide the bar charts for uptime of a monitor on a status page
            home screen
        showUptimePercentage:
          type: boolean
          example: false
          title: Show uptime percentage
          description: >-
            Show or hide the uptime percentage of a monitor near the monitor
            name on a status page home screen
        enableFloatingStatus:
          type: boolean
          example: false
          title: Enable floating status bar
          description: >-
            Enable or disable the floating bar sticked to the bottom with the
            overall count of up and down monitors
        showOverallUptime:
          type: boolean
          example: false
          title: Show overall percentage
          description: >-
            Show or hide the overall uptime (last 24 h, last 7 and 30 days)
            section below monitors list on a status page home screen
        showOutageUpdates:
          type: boolean
          example: false
          title: Show outage details
          description: >-
            Show outage reason details (like status code) to give more
            explanation for your status page users
        showOutageDetails:
          type: boolean
          example: false
          title: Show outage updates and the latest downtime
          description: >-
            Show or hide downtimes grouped by day for a specific monitor in the
            Announcement feed. The latest downtime will be visible in header.
            This won't hide the events on a details page
        enableDetailsPage:
          type: boolean
          example: false
          title: Enable Details Page
          description: >-
            Details page contains uptime, response times and up/down event
            history
        showMonitorURL:
          type: boolean
          example: false
          title: Show the monitor URL
          description: >-
            Show monitor URL and type to give your users more details on your
            Status page
        hidePausedMonitors:
          type: boolean
          example: false
          title: Hide paused monitors
          description: Don't display paused monitors on your Status page
    CustomSettingsDto:
      type: object
      properties:
        font:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FontCustomSettingsDto'
        page:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PageCustomSettingsDto'
        colors:
          nullable: true
          description: The colors of the page
          allOf:
