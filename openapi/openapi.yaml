        property:
          type: string
          maxLength: 500
          description: >-
            Assertion source: safe JSONPath, headers.<name>, status_code, or
            body
          example: $.data.status
        comparison:
          enum:
            - equals
            - not_equals
            - contains
            - not_contains
            - greater_than
            - less_than
            - is_null
            - is_not_null
            - is_string
            - is_number
            - is_boolean
            - is_array
            - is_object
            - is_empty
            - is_not_empty
            - length_equals
            - length_not_equals
            - length_greater_than
            - length_less_than
            - exists
            - not_exists
          type: string
          description: Comparison operator
          example: equals
        target:
          description: >-
            Expected native JSON value. Arrays and objects are supported for
            body-JSON equality and containment; omit target for null, type,
            existence, and empty comparisons.
          example:
            - active
            - role: primary
          oneOf:
            - type: string
              nullable: true
            - type: number
            - type: boolean
            - type: array
              items: {}
            - type: object
              additionalProperties: true
      required:
        - property
        - comparison
