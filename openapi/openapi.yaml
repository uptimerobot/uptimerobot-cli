        Create a personal alert contact. Email and push (iOS/Android) are
        supported; Pro SMS and voice require phone verification and are not
        creatable here.
      operationId: AlertContactsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonalAlertContactDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertContactDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Create a personal alert contact
      tags:
        - Alert Contacts
  /alert-contacts/{id}:
    get:
      description: Get a personal alert contact details by ID
      operationId: AlertContactsController_get
      parameters:
        - name: id
          required: true
          in: path
          description: ID of the personal alert contact
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertContactDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Get a personal alert contact by ID
      tags:
        - Alert Contacts
    patch:
      description: Update a personal alert contact
      operationId: AlertContactsController_update
      parameters:
        - name: id
          required: true
          in: path
          description: ID of the personal alert contact
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonalAlertContactDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertContactDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Update a personal alert contact
      tags:
        - Alert Contacts
    delete:
      description: Delete a personal alert contact
      operationId: AlertContactsController_delete
      parameters:
        - name: id
          required: true
          in: path
          description: ID of the personal alert contact
          schema:
            type: number
      responses:
        '200':
          description: ''
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Delete a personal alert contact
      tags:
        - Alert Contacts
  /tags:
    get:
      description: >-
        Get a paginated list of tags for the authenticated user, sorted by ID in
        ascending order
      operationId: TagsController_getTags
      parameters:
        - name: limit
          required: false
          in: query
          description: >-
            Maximum number of tags to return per page. Default: 50, Min: 1, Max:
            200.
          schema:
            minimum: 1
            maximum: 200
            example: 50
            type: number
        - name: cursor
          required: false
          in: query
          description: Cursor for pagination
          schema:
            type: number
      responses:
        '200':
          description: User tags retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleTagPaginationDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: List user tags
      tags:
        - Tags
  /tags/{id}:
    delete:
      description: Delete a tag and remove it from all monitors
      operationId: TagsController_deleteTag
      parameters:
        - name: id
          required: true
          in: path
          description: Tag ID to delete
          schema:
            type: number
      responses:
        '204':
          description: Tag deleted successfully
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Delete a tag
      tags:
        - Tags
  /third-party-providers:
    get:
      description: >-
        Search the third-party provider catalog by provider or component name.
        Each provider is identified by its numeric id, and isTracked tells
        whether the account already monitors it as a third-party service.
        Results are cached for a minute, so isTracked can lag by up to a minute
        after a third-party service is created or deleted.
      operationId: ThirdPartyProvidersController_search
      parameters:
        - name: search
          required: true
          in: query
          description: Free-text term matched against provider names and their components.
          schema:
            minLength: 1
            maxLength: 100
            example: github
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdPartyProviderSearchDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Search third-party providers
      tags:
        - Third-party providers
  /third-party-providers/{id}:
    get:
      description: >-
        Returns one third-party provider by its numeric id, with its current
        state and its component tree. Components carry their own id, name and
        status, and list their children.
      operationId: ThirdPartyProvidersController_getById
      parameters:
        - name: id
          required: true
          in: path
          description: The numeric id of the third-party provider.
          schema:
            example: '7'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdPartyProviderDetailDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Get a third-party provider
      tags:
        - Third-party providers
