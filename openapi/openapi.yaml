            - MobileAppIOS
            - MobileAppAndroid
            - MobileAppOld
            - MobileApp
          type: string
          description: >-
            Personal alert-contact type. Email and mobile push for iOS or
            Android are creatable here; Pro SMS and voice require phone
            verification. Use MobileAppIOS or MobileAppAndroid for mobile push.
