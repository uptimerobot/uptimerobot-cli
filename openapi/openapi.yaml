openapi: 3.0.0
paths:
  /monitors/bulk/pause:
    post:
      description: >-
        Pauses monitors matching the specified filters. Provide groupId, tagId,
        or both. When both are given, only monitors matching both filters are
        affected. Returns per-monitor results.
      operationId: BulkMonitorsController_bulkPause
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicBulkPauseDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Pause monitors by group and/or tag
      tags:
        - Monitors - Bulk Operations
  /monitors/bulk/start:
    post:
      description: >-
        Starts all paused monitors matching the specified filters. Provide
        groupId, tagId, or both. When both are given, only monitors matching
        both filters are affected. Returns per-monitor results.
      operationId: BulkMonitorsController_bulkStart
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicBulkStartDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Start monitors by group and/or tag
      tags:
        - Monitors - Bulk Operations
  /monitors/bulk/update:
    post:
      description: >-
        Updates settings for monitors matching the specified filters. Provide
        groupId, tagId, or both. When both are given, only monitors matching
        both filters are affected. Returns per-monitor results.
      operationId: BulkMonitorsController_bulkUpdate
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicBulkUpdateDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Update monitors by group and/or tag
      tags:
        - Monitors - Bulk Operations
  /incidents:
    get:
      description: >-
        List all incidents in a user's account with optional filtering. Values
        can be paginated with the cursor parameter.
      operationId: IncidentsController_list
      parameters:
        - name: cursor
          required: false
          in: query
          description: Cursor to paginate through incidents (incident ID)
          schema:
            pattern: /^\d+$/
            example: '12345'
            type: string
        - name: monitor_id
          required: false
          in: query
          description: Filter incidents by monitor ID
          schema:
            minimum: 1
            example: 123
            type: number
        - name: monitor_name
          required: false
          in: query
          description: Filter incidents by monitor name (partial match)
          schema:
            example: production
            type: string
        - name: started_after
          required: false
          in: query
          description: Filter incidents started after this date (ISO 8601 format)
          schema:
            example: '2024-01-01T00:00:00Z'
            type: string
        - name: started_before
          required: false
          in: query
          description: Filter incidents started before this date (ISO 8601 format)
          schema:
            example: '2024-12-31T23:59:59Z'
            type: string
        - name: status
          required: false
          in: query
          description: >-
            Filter incidents by status. "open" returns only currently ongoing
            incidents, regardless of started_after/started_before.
          schema:
            enum:
              - open
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentSummaryPaginationDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: List incidents
      tags:
        - Incidents
  /incidents/{id}:
    get:
      description: Get incident details including root cause information
      operationId: IncidentsController_get
      parameters:
        - name: id
          required: true
          in: path
          description: The incident ID
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetailDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Get an incident by ID
      tags:
        - Incidents
  /incidents/{id}/comments:
    get:
      description: >-
        Returns paginated comments for a specific incident, ordered by creation
        date ascending (oldest first).
      operationId: IncidentsController_listComments
      parameters:
        - name: id
          required: true
          in: path
          description: The incident ID
          schema:
            type: string
        - name: cursor
          required: false
          in: query
          description: Cursor to paginate through comments (comment ID)
          schema:
            pattern: /^\d+$/
            example: '42'
            type: string
        - name: limit
          required: false
          in: query
          description: Number of comments to return (1-100, default 50)
          schema:
            minimum: 1
            maximum: 100
            default: 50
            example: 50
            type: number
      responses:
        '200':
          description: List of comments for the incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIncidentCommentsPaginationDto'
        '401':
          description: Unauthorized - missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '404':
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: List incident comments
      tags:
        - Incidents
    post:
      description: Create a new comment on an incident
      operationId: IncidentsController_createComment
      parameters:
        - name: id
          required: true
          in: path
          description: ID of the incident
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncidentCommentRequestDto'
      responses:
        '201':
          description: Comment created successfully
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '401':
          description: Unauthorized - missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '403':
          description: Forbidden - no write permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '404':
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Create incident comment
      tags:
        - Incidents
  /incidents/{id}/activity-log:
    get:
      description: >-
        Returns the activity log for an incident, including status updates,
        comments, and notifications. Sorted by date descending, newest first.
        Values can be paginated with the cursor parameter.
      operationId: IncidentsController_getActivityLog
      parameters:
        - name: id
          required: true
          in: path
          description: ID of the incident
          schema:
            type: string
        - name: cursor
          required: false
          in: query
          description: >-
            Cursor to paginate through further notification entries (comments,
            status updates and system events are only returned on the first
            page)
          schema:
            pattern: /^[A-Za-z0-9_-]+$/
            example: MjAyNi0wOS0xMiAxMDowMjowMXw0MjAwMDAwMDAwMDAwMDExfDQ0fDIwMA
            type: string
        - name: limit
          required: false
          in: query
          description: >-
            Maximum number of notification entries per page (1-200, default 50).
            The first page also carries every comment, status update and system
            event on top of those, so it can hold more than `limit` entries.
          schema:
            minimum: 1
            maximum: 200
            default: 50
            example: 50
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Get incident activity log
      tags:
        - Incidents
  /incidents/{id}/alerts:
    get:
      description: >-
        Returns alerts that were sent for a specific incident, including
        recipient information and delivery status. Sorted by date descending,
        newest first. Values can be paginated with the cursor parameter.
      operationId: IncidentsController_getAlerts
      parameters:
        - name: id
          required: true
          in: path
          description: ID of the incident
          schema:
            type: string
        - name: cursor
          required: false
          in: query
          description: Cursor to paginate through sent alerts
          schema:
            pattern: /^[A-Za-z0-9_-]+$/
            example: MjAyNi0wOS0xMiAxMDowMjowMXw0MjAwMDAwMDAwMDAwMDExfDQ0fDIwMA
            type: string
        - name: limit
          required: false
          in: query
          description: Number of sent alerts to return (1-200, default 50)
          schema:
            minimum: 1
            maximum: 200
            default: 50
            example: 50
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSentAlertsResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Get incident sent alerts
      tags:
        - Incidents
  /incidents/{id}/comments/{commentId}:
    patch:
      description: Updates an existing comment on an incident
      operationId: IncidentsController_updateComment
      parameters:
        - name: id
          required: true
          in: path
          description: The incident ID
          schema:
            type: string
        - name: commentId
          required: true
          in: path
          description: The comment ID
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncidentCommentRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentCommentDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Update an incident comment
      tags:
        - Incidents
    delete:
      description: Delete a comment from an incident
      operationId: IncidentsController_deleteComment
      parameters:
        - name: id
          required: true
          in: path
          description: ID of the incident
          schema:
            type: string
        - name: commentId
          required: true
          in: path
          description: ID of the comment
          schema:
            type: number
      responses:
        '204':
          description: Comment deleted successfully
        '401':
          description: Unauthorized - missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '403':
          description: Forbidden - no write permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '404':
          description: Incident or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Delete incident comment
      tags:
        - Incidents
  /monitor-groups:
    post:
      description: >-
        Create a new monitor group with optional initial monitors. Monitors can
        be assigned by providing their IDs or by specifying existing group IDs
        whose monitors should be moved.
      operationId: MonitorGroupsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMonitorGroupDto'
      responses:
        '201':
          description: Monitor group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorGroupDto'
        '400':
          description: Validation error (invalid name, monitorIds, or groupIds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '403':
          description: >-
            Forbidden - no write permission or monitor-groups feature not
            available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Create a monitor group
      tags:
        - Monitor Groups
    get:
      description: >-
        List all monitor groups in a user's account. Values can be paginated
        with the cursor parameter.
      operationId: MonitorGroupsController_list
      parameters:
        - name: limit
          required: false
          in: query
          description: >-
            Maximum number of monitor groups to return per page. Default: 50,
            Min: 1, Max: 200.
          schema:
            minimum: 1
            maximum: 200
            example: 50
            type: number
        - name: cursor
          required: false
          in: query
          description: Cursor for pagination (ID of the last item from previous page)
          schema:
            type: number
      responses:
        '200':
          description: Monitor groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorGroupPaginationDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: List monitor groups
      tags:
        - Monitor Groups
  /monitor-groups/{id}:
    get:
      description: Get monitor group details by ID
      operationId: MonitorGroupsController_get
      parameters:
        - name: id
          required: true
          in: path
          description: The monitor group ID
          schema:
            type: number
      responses:
        '200':
          description: Monitor group retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorGroupDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Get a monitor group by ID
      tags:
        - Monitor Groups
    patch:
      description: Update (rename) an existing monitor group
      operationId: MonitorGroupsController_update
      parameters:
        - name: id
          required: true
          in: path
          description: The monitor group ID
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMonitorGroupDto'
      responses:
        '200':
          description: Monitor group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorGroupDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Update a monitor group
      tags:
        - Monitor Groups
    delete:
      description: >-
        Delete a monitor group. Monitors in the deleted group will be moved to
        the specified group or to the default group (ID: 0).
      operationId: MonitorGroupsController_delete
      parameters:
        - name: id
          required: true
          in: path
          description: The monitor group ID to delete
          schema:
            type: number
        - name: monitorsNewGroupId
          required: false
          in: query
          description: >-
            Optional group ID to move monitors to. If not provided, monitors
            will be moved to default group (ID: 0).
          schema:
            minimum: 1
            example: 123
            type: number
      responses:
        '204':
          description: Monitor group deleted successfully
        '400':
          description: Cannot delete default group or invalid new group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '403':
          description: >-
            Forbidden - no write permission or monitor-groups feature not
            available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        '404':
          description: Monitor group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Delete a monitor group
      tags:
        - Monitor Groups
  /monitors/storm-protection:
    get:
      description: >-
        Get the account-wide storm protection (alert grouping) settings. Returns
        defaults when not yet configured.
      operationId: StormProtectionController_get
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StormProtectionSettingsResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Get storm protection settings
      tags:
        - Storm Protection
    patch:
      description: >-
        Update the account-wide storm protection (alert grouping) settings.
        Partial update — only provided fields are changed.
      operationId: StormProtectionController_update
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStormProtectionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StormProtectionSettingsResponseDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Update storm protection settings
      tags:
        - Storm Protection
  /monitors:
    get:
      description: >-
        List all monitors in a user's account. Values can be paginated with the
        cursor parameter. Optionally filter by tags, URL, name, status, groupId,
        or limit. All filters use AND logic when combined.
      operationId: MonitorsController_list
      parameters:
        - name: customField
          required: false
          in: query
          description: >-
            Filter monitors by custom field key:value pairs. Format:
            customField=key:value. Multiple filters use AND logic. Split on
            first colon only.
          schema:
            example: environment:production
            type: array
            items:
              type: string
        - name: limit
          required: false
          in: query
          description: >-
            Maximum number of monitors to return per page. Default: 50, Min: 1,
            Max: 200.
          schema:
            example: 50
            type: number
        - name: groupId
          required: false
          in: query
          description: Filter monitors by monitor group ID.
          schema:
            example: 100
            type: number
        - name: status
          required: false
          in: query
          description: >-
            Comma-separated list of status values to filter monitors. Uses OR
            logic (matches any specified status). Case-insensitive. Allowed
            values: PAUSED, STARTED, UP, LOOKS_DOWN, DOWN.
          schema:
            example: UP,DOWN
            type: string
        - name: name
          required: false
          in: query
          description: >-
            Filter monitors by name. Case-insensitive partial match on the
            monitor friendly name.
          schema:
            example: Production API
            type: string
        - name: url
          required: false
          in: query
          description: >-
            Filter monitors by URL. Case-insensitive partial match on the
            monitor URL.
          schema:
            example: example.com
            type: string
        - name: tags
          required: false
          in: query
          description: >-
            Comma-separated list of tag names to filter monitors. Uses OR logic
            (matches any specified tag). Case-sensitive.
          schema:
            example: production,staging
            type: string
        - name: cursor
          required: false
          in: query
          description: Cursor to paginate through monitors
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorPaginationDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: List monitors
      tags:
        - Monitors
    post:
      description: >-
        New monitors of any type can be created using this endpoint. The request
        body is documented as one schema per monitor type — pick the one
        matching the `type` you are creating.
      operationId: MonitorsController_create
      parameters: []
      requestBody:
        required: true
        description: >-
          Monitor to create. The `type` field selects which shape the body must
          take — each monitor type requires a different set of fields. Type
          names are matched case-insensitively; the canonical form is upper
          case.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateHttpMonitorDto'
                - $ref: '#/components/schemas/CreateKeywordMonitorDto'
                - $ref: '#/components/schemas/CreatePingMonitorDto'
                - $ref: '#/components/schemas/CreatePortMonitorDto'
                - $ref: '#/components/schemas/CreateHeartbeatMonitorDto'
                - $ref: '#/components/schemas/CreateDnsMonitorDto'
                - $ref: '#/components/schemas/CreateApiMonitorDto'
                - $ref: '#/components/schemas/CreateUdpMonitorDto'
                - $ref: '#/components/schemas/CreateVisualComparisonMonitorDto'
                - $ref: '#/components/schemas/CreateThirdPartyServiceMonitorDto'
              discriminator:
                propertyName: type
                mapping:
                  HTTP: '#/components/schemas/CreateHttpMonitorDto'
                  KEYWORD: '#/components/schemas/CreateKeywordMonitorDto'
                  PING: '#/components/schemas/CreatePingMonitorDto'
                  PORT: '#/components/schemas/CreatePortMonitorDto'
                  HEARTBEAT: '#/components/schemas/CreateHeartbeatMonitorDto'
                  DNS: '#/components/schemas/CreateDnsMonitorDto'
                  API: '#/components/schemas/CreateApiMonitorDto'
                  UDP: '#/components/schemas/CreateUdpMonitorDto'
                  VISUAL_COMPARISON: '#/components/schemas/CreateVisualComparisonMonitorDto'
                  THIRD_PARTY_SERVICE: '#/components/schemas/CreateThirdPartyServiceMonitorDto'
            examples:
              HTTP Monitor:
                value:
                  friendlyName: My HTTP monitor
                  type: HTTP
                  url: https://example.com
                  interval: 60
                  timeout: 30
              HTTP/Keyword Monitor (IP version):
                value:
                  friendlyName: My HTTP monitor
                  type: HTTP
                  url: https://example.com
                  interval: 60
                  timeout: 30
                  config:
                    ipVersion: ipv6Only
              HTTP/Keyword Monitor (SSL expiration periods):
                value:
                  friendlyName: My HTTPS monitor
                  type: HTTP
                  url: https://example.com
                  interval: 60
                  timeout: 30
                  config:
                    sslExpirationPeriodDays:
                      - 7
                      - 14
                      - 30
              Keyword Monitor:
                value:
                  friendlyName: My Keyword monitor
                  type: KEYWORD
                  url: https://example.com
                  interval: 60
                  timeout: 30
                  keywordType: ALERT_EXISTS
                  keywordCaseType: CaseSensitive
                  keywordValue: Service Unavailable
              Ping Monitor:
                value:
                  friendlyName: My Ping monitor
                  type: PING
                  url: example.com
                  interval: 60
                  timeout: 30
              Port Monitor:
                value:
                  friendlyName: My Port monitor
                  type: PORT
                  url: example.com
                  port: 443
                  interval: 60
                  timeout: 30
              Heartbeat Monitor:
                value:
                  friendlyName: My Heartbeat monitor
                  type: HEARTBEAT
                  interval: 60
                  gracePeriod: 300
              DNS Monitor:
                value:
                  friendlyName: My DNS monitor
                  type: DNS
                  url: example.com
                  interval: 60
                  config:
                    dnsRecords:
                      CNAME:
                        - example.com
                      MX:
                        - 1 aspmx.l.google.com.
                        - 5 alt1.aspmx.l.google.com.
                      NS:
                        - ns-cloud-a1.googledomains.com.
                        - ns-cloud-a2.googledomains.com.
                      A:
                        - 192.168.1.1
                      PTR:
                        - example.com
              API Monitor:
                value:
                  friendlyName: My API monitor
                  type: API
                  url: https://api.example.com/health
                  interval: 60
                  timeout: 30
                  config:
                    apiAssertions:
                      logic: AND
                      checks:
                        - property: $.data.status
                          comparison: equals
                          target: active
                        - property: $.data.count
                          comparison: greater_than
                          target: 0
                    ipVersion: ipv4Only
                    sslExpirationPeriodDays:
                      - 7
                      - 14
                      - 30
              UDP Monitor:
                value:
                  friendlyName: My UDP monitor
                  type: UDP
                  url: 1.2.3.4
                  port: 53
                  interval: 60
                  timeout: 30
                  config:
                    udp:
                      payload: ping
                      packetLossThreshold: 50
              Visual Comparison Monitor:
                value:
                  friendlyName: My Visual Comparison monitor
                  type: VISUAL_COMPARISON
                  url: https://example.com
                  interval: 300
                  config:
                    visualComparison:
                      sensitivityThreshold: 10
                      viewport: desktop
              Third Party Service:
                value:
                  type: THIRD_PARTY_SERVICE
                  config:
                    thirdPartyService:
                      providerId: 4317
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Create a monitor
      tags:
        - Monitors
  /monitors/uptime-stats:
    get:
      description: >-
        Returns aggregated uptime statistics across all monitors for the
        specified timeframe, including a logs array of incident entries.
      operationId: MonitorsController_getUptimeStats
      parameters:
        - name: logLimit
          required: false
          in: query
          description: Maximum number of log entries to return (1-500).
          schema:
            minimum: 1
            maximum: 500
            default: 50
            example: 50
            type: number
        - name: timeFrame
          required: true
          in: query
          description: >-
            Timeframe for statistics. Use CUSTOM with start/end for custom
            range.
          schema:
            enum:
              - DAY
              - WEEK
              - MONTH
              - DAYS_30
              - YEAR
              - ALL
              - CUSTOM
            type: string
        - name: start
          required: false
          in: query
          description: Start timestamp (Unix seconds). Required when timeFrame=CUSTOM.
          schema:
            minimum: 1
            type: number
        - name: end
          required: false
          in: query
          description: >-
            End timestamp (Unix seconds). Required when timeFrame=CUSTOM. Must
            be > start.
          schema:
            minimum: 0
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UptimeStatsDto'
        default:
          description: >-
            An error response. `code` is a member of the published error code
            vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDto'
      security:
        - bearer: []
      summary: Get aggregated uptime statistics
      tags:
        - Monitors
