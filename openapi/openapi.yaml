          description: >-
            Human-readable error detail. An array of per-field messages for
            validation failures, a single string otherwise.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        statusCode:
          type: number
          description: The HTTP status code, present on validation failures.
        error:
          type: string
          description: The HTTP status text, present on validation failures.
      required:
        - code
        - message
    PublicBulkPauseDto:
      type: object
      properties:
        groupId:
          type: number
          minimum: 0
          description: >-
            ID of the monitor group to filter by (0 = default group / ungrouped
            monitors). At least one of groupId or tagId must be provided.
          example: 1
        tagId:
          type: number
          minimum: 1
          description: >-
            ID of the tag to filter by. At least one of groupId or tagId must be
            provided. When both groupId and tagId are specified, only monitors
            matching both filters are affected.
          example: 42
    BulkOperationResponseDto:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              monitorId:
                type: number
              monitorName:
                type: string
              status:
                type: string
                enum:
                  - success
                  - error
              error:
                type: string
              code:
                type: string
            required:
              - monitorId
              - status
        totalSuccess:
          type: number
        totalError:
          type: number
      required:
        - results
        - totalSuccess
        - totalError
    PublicBulkStartDto:
      type: object
      properties:
        groupId:
          type: number
          minimum: 0
          description: >-
            ID of the monitor group to filter by (0 = default group / ungrouped
            monitors). At least one of groupId or tagId must be provided.
          example: 1
        tagId:
          type: number
          minimum: 1
          description: >-
            ID of the tag to filter by. At least one of groupId or tagId must be
            provided. When both groupId and tagId are specified, only monitors
            matching both filters are affected.
          example: 42
    RegionalDataDto:
      type: object
      properties:
        REGION:
          minItems: 1
          type: array
          items:
            type: string
            enum:
              - na
              - eu
              - as
              - oc
        MANUAL_SELECTED:
          type: boolean
          description: >-
            Whether the customer chose REGION explicitly. On update, false means
            the region was not customer-chosen, so REGION is ignored and the
            monitor keeps the region it already runs from. Send true to change
            the region, or omit this field.
        THRESHOLD:
          type: object
          additionalProperties: false
          properties:
            na:
              type: number
            eu:
              type: number
            as:
              type: number
            oc:
              type: number
          description: Regional threshold values in milliseconds mapped by region code
          example:
            na: 5000
            eu: 6000
            as: 7000
            oc: 8000
      required:
        - REGION
    PublicBulkUpdateDto:
      type: object
      properties:
        groupId:
          type: number
          minimum: 0
          description: >-
            ID of the monitor group to filter by (0 = default group / ungrouped
            monitors). At least one of groupId or tagId must be provided.
          example: 1
        tagId:
          type: number
          minimum: 1
          description: >-
            ID of the tag to filter by. At least one of groupId or tagId must be
            provided. When both groupId and tagId are specified, only monitors
            matching both filters are affected.
          example: 42
        interval:
          type: number
          minimum: 15
          description: Monitoring interval in seconds
          example: 60
        timeout:
          type: number
          minimum: 0
          maximum: 60
          description: Timeout in seconds
          example: 30
        gracePeriod:
          type: number
          minimum: 0
          maximum: 86400
          description: Grace period in seconds
          example: 300
        checkSSLErrors:
          type: boolean
          description: Whether to check for SSL errors
        domainExpirationReminder:
          type: boolean
          description: Whether to enable domain expiration reminder
        sslExpirationReminder:
          type: boolean
          description: Whether to enable SSL expiration reminder
        responseTimeThreshold:
          type: number
          minimum: 0
          maximum: 60000
          description: Response time threshold in milliseconds
        regionalData:
          description: Regional data configuration
          allOf:
            - $ref: '#/components/schemas/RegionalDataDto'
        customFields:
          type: object
          description: >-
            Custom key-value metadata to set on all monitors in the group. Max
            20 keys. Keys: alphanumeric + underscore + hyphen, max 64 chars.
            Values: max 255 chars. Paid plans only.
          example:
            environment: production
            team: platform
    IncidentSummaryPaginationDto:
      type: object
      properties:
        nextLink:
          type: string
          nullable: true
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status: {}
              type: {}
              cause:
                type: number
                nullable: true
              reason:
                type: string
              monitor:
                type: object
                properties:
                  id:
                    type: number
                  friendlyName:
                    type: string
                    nullable: true
                required:
                  - id
                  - friendlyName
              commentsCount:
                type: number
              startedAt: {}
              resolvedAt:
                nullable: true
              duration:
                type: number
                nullable: true
              includeInReports:
                type: boolean
            required:
              - id
              - status
              - type
              - cause
              - reason
              - monitor
              - commentsCount
              - startedAt
              - resolvedAt
              - duration
              - includeInReports
      required:
        - nextLink
        - data
    IncidentDetailDto:
      type: object
      properties:
        id:
          type: string
        status: {}
        cause:
          type: number
        reason:
          type: string
        duration:
          type: number
          minimum: 0
          exclusiveMinimum: false
          nullable: true
        startedAt:
          oneOf:
            - {}
            - type: string
        resolvedAt:
          oneOf:
            - {}
            - type: string
          nullable: true
        rootCause:
          type: object
          properties:
            url:
              type: string
              nullable: true
            requestHeaders:
              type: object
              additionalProperties: {}
              nullable: true
            responseHeaders:
              type: object
              additionalProperties: {}
              nullable: true
            httpResponseCode:
              type: number
              nullable: true
            responseDownloadUrl:
              type: string
              nullable: true
            assertionDiagnostics:
              type: object
              properties:
                version:
                  type: number
                  minimum: 1
                  maximum: 1
                logic:
                  type: string
                  enum:
                    - AND
                    - OR
                summary:
                  type: object
                  properties:
                    passed:
                      type: boolean
                    total:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: false
                    passedCount:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: false
                    failedCount:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: false
                  required:
                    - passed
                    - total
                    - passedCount
                    - failedCount
                results:
                  type: array
                  items:
                    type: object
                    properties:
                      index:
                        type: integer
                        minimum: 0
                        exclusiveMinimum: false
                      property:
                        type: string
                      source:
                        type: string
                        enum:
                          - body_json
                          - header
                          - status_code
                          - body_text
                      selector:
                        type: string
                      comparison:
                        type: string
                        enum:
                          - equals
                          - not_equals
                          - contains
                          - not_contains
                          - greater_than
                          - less_than
                          - is_null
                          - is_not_null
                          - is_string
                          - is_number
                          - is_boolean
                          - is_array
                          - is_object
                          - is_empty
                          - is_not_empty
                          - length_equals
                          - length_not_equals
                          - length_greater_than
                          - length_less_than
                          - exists
                          - not_exists
                        x-enumNames:
                          - EQUALS
                          - NOT_EQUALS
                          - CONTAINS
                          - NOT_CONTAINS
                          - GREATER_THAN
                          - LESS_THAN
                          - IS_NULL
                          - IS_NOT_NULL
                          - IS_STRING
                          - IS_NUMBER
                          - IS_BOOLEAN
                          - IS_ARRAY
                          - IS_OBJECT
                          - IS_EMPTY
                          - IS_NOT_EMPTY
                          - LENGTH_EQUALS
                          - LENGTH_NOT_EQUALS
                          - LENGTH_GREATER_THAN
                          - LENGTH_LESS_THAN
                          - EXISTS
                          - NOT_EXISTS
                      passed:
                        type: boolean
                      actualTypes:
                        type: array
                        items:
                          type: string
                          enum:
                            - missing
                            - 'null'
                            - boolean
                            - number
                            - string
                            - array
                            - object
                      actualSummary:
                        type: string
                      targetType:
                        type: string
                        enum:
                          - missing
                          - 'null'
                          - boolean
                          - number
                          - string
                          - array
                          - object
                      targetSummary:
                        type: string
                      selectedCount:
                        type: integer
