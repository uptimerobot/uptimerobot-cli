    CreateMaintenanceWindowDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          description: Friendly name of the maintenance window
          example: Friday Maintenance window
        autoAddMonitors:
          type: boolean
          description: >-
            If true, all monitors are automatically added to this maintenance
            window
          example: false
        interval:
          enum:
            - once
            - daily
            - weekly
            - monthly
          type: string
        date:
          type: string
          example: '2024-06-20'
          description: >-
            Start date of the maintenance window in YYYY-MM-DD format (years
            19xx or 20xx only)
        time:
          type: string
          pattern: /^(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d$/
          example: '14:30:00'
          description: Start time of the maintenance window in HH:mm:ss format
        duration:
          type: number
          minimum: 1
          example: 30
          description: >-
            Duration of the maintenance window in minutes. Maintenance window
            will be active for this duration
        days:
          description: >-
            (only needed for weekly and monthly maintenance windows). E.g. [2,
            4, 5] for Tuesday, Thursday and Friday or [10, 17, 26] for the days
            of the month. -1 for last day of the month)
          example:
            - 2
            - 4
            - 5
          type: array
          items:
            type: number
        monitorIds:
          description: List of monitor IDs to be assigned to the maintenance window
          example:
            - 1
            - 2
            - 3
          type: array
          items:
            type: number
      required:
        - name
        - interval
        - date
        - time
        - duration
    UpdateMaintenanceWindowDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Weekend Maintenance Window
          description: Name of the maintenance window
        interval:
          enum:
            - once
            - daily
            - weekly
            - monthly
          type: string
        date:
          type: string
          example: '2024-06-20'
          description: >-
            Start date of the maintenance window in YYYY-MM-DD format (years
            19xx or 20xx only)
        time:
          type: string
          pattern: /^(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d$/
          example: '12:00:00'
          description: Time format in HH:mm:ss
        duration:
          type: number
          minimum: 1
          example: 10
          description: Duration in minutes
        days:
          description: >-
            (only needed for weekly and monthly maintenance windows). E.g. [2,
            4, 5] for Tuesday, Thursday and Friday or [10, 17, 26] for the days
            of the month. -1 for last day of the month)
          example:
            - 2
            - 4
            - 5
          type: array
          items:
            type: number
        monitorIds:
          description: Array of monitor IDs to associate with this maintenance window
          example:
            - 1
            - 2
            - 3
          type: array
          items:
            type: number
        status:
          enum:
            - active
            - paused
          type: string
          description: >-
            Pause or resume the maintenance window. `paused` stops it from
            suppressing alerts; `active` re-enables it. Omit to leave the
            current status unchanged.
          example: active
