        features:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeaturesCustomSettingsDto'
    CreatePsPDto:
      type: object
      properties:
        monitorIds:
          description: >-
            List of monitor IDs to be assigned to the PSP. `[0]` on its own is
            the sentinel for "every monitor in the account"; an empty array
            detaches all of them. In multipart/form-data, repeat the field
            (`monitorIds=1&monitorIds=2`) or use the bracket suffix
            (`monitorIds[]=1`); `monitorIds[]=` with no value is the empty
            array.
          type: array
          items:
            type: number
            maximum: 2147483647
            minimum: 0
        tagIds:
          description: >-
            List of tag IDs to be assigned to the PSP. Uses the same multipart
            encoding as `monitorIds`.
          type: array
          items:
            type: number
            maximum: 2147483647
            minimum: 1
        autoAddMonitors:
          type: boolean
          description: >-
            If enabled all monitors (old and new) will be added to PSP
            automatically. An explicit "monitorIds" wins over this flag when
            both are sent — including an empty "monitorIds", which detaches
            every monitor.
        friendlyName:
          type: string
          maxLength: 255
          example: My Status Page
          description: Friendly name of the Public Status Page
        logo:
          type: string
          format: binary
          description: >-
            Logo image file. Accepted formats: JPG, JPEG, PNG. Max file size:
            150 KB. Dimensions: width 20-400px, height 10-200px.
        icon:
          type: string
          format: binary
          description: >-
            Icon image file. Accepted formats: JPG, JPEG, PNG. Max file size:
            150 KB. Dimensions: width 20-400px, height 10-200px.
        password:
          type: string
          maxLength: 255
          description: Password protection for the Public Status Page
        customDomain:
          type: string
          maxLength: 255
          description: >-
            Provide when you want to use custom domain for the Public Status
            Page
          example: status.your-domain.com
        hideUrlLinks:
          type: boolean
          description: This will hide "Powered by UptimeRobot" link in footer
          example: false
        noIndex:
          type: boolean
          description: >-
            Set HTML meta tag to allow or disallow search engines to index your
            status page
