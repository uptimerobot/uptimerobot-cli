            - ipv6Only
          description: >-
            IP version preference. Omit for default behavior (IPv4 priority,
            falls back to IPv6). Not supported by DNS, Heartbeat, Visual
            Comparison or third-party service monitors. Send null to remove.
          nullable: true
          example: ipv4Only
        applicationErrorRetries:
          type: number
          minimum: 0
          maximum: 3
          description: >-
            Number of retries on application errors (HTTP 4xx/5xx). 0-3.
            Connection errors always retry 3 times regardless of this setting.
            HTTP, Keyword and API monitors only. Send null to remove.
          nullable: true
          example: 1
        visualComparison:
          description: >-
            Visual comparison configuration. Visual Comparison monitors only.
            Send null to remove.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PermissiveVisualComparisonFieldsDto'
        thirdPartyService:
          description: >-
            Third party service configuration - the isdown provider to track
            and, optionally, which of its components to scope tracking to. Third
            party services only. Send null to remove.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ThirdPartyServiceConfigDto'
    UpdateMonitorDto:
      type: object
      properties:
        friendlyName:
          type: string
          maxLength: 250
          example: My monitor
          description: Friendly name of the monitor
        url:
          type: string
          maxLength: 10000
          example: http://test.com
          description: >-
            URL of the monitor. For DNS monitors: DNS server IP or hostname. Not
            required for Heartbeat monitor
        type:
          enum:
            - HTTP
            - KEYWORD
            - PING
            - PORT
            - HEARTBEAT
            - DNS
            - API
            - UDP
            - VISUAL_COMPARISON
            - THIRD_PARTY_SERVICE
          type: string
          example: HTTP
        port:
          type: number
          minimum: 1
          maximum: 65535
          description: Required for Port and UDP monitors
        portAlertCondition:
          enum:
            - CLOSED
            - OPEN
          type: string
          example: CLOSED
          description: >-
            Alerting condition for Port monitors. Only valid when type is Port;
            defaults to CLOSED when omitted.
        keywordType:
          enum:
            - ALERT_EXISTS
            - ALERT_NOT_EXISTS
          type: string
          example: ALERT_EXISTS
          description: Required for Keyword monitor
        keywordCaseType:
          enum:
            - 0
            - 1
          type: number
          description: Required for Keyword monitor
        keywordValue:
          type: string
          nullable: true
          maxLength: 500
          description: Required for Keyword monitor
        interval:
          type: number
          minimum: 15
          example: 60
          description: >-
            Interval of check in seconds. Heartbeat monitors support at most
            2678400 seconds (31 days).
        timeout:
          type: number
          minimum: 0
          maximum: 60
          example: 30
          description: >-
            Timeout of check in seconds. Only for Http, Keyword and Port
            monitors
        gracePeriod:
          type: number
          minimum: 0
          maximum: 86400
          example: 300
          description: Grace period of check in seconds. Only for Heartbeat monitor
        httpUsername:
          type: string
          maxLength: 255
          example: admin
          description: Username for HTTP Basic authentication
        httpPassword:
          type: string
          maxLength: 255
          example: password
          description: Password for HTTP Basic authentication
        httpMethodType:
          nullable: true
          enum:
            - HEAD
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - QUERY
          type: string
          example: HEAD
          description: >-
            HTTP method to use for the request. For HTTP and Keyword monitors it
            defaults to HEAD if omitted; API monitors default to GET and do not
            allow HEAD
        authType:
          enum:
            - NONE
            - HTTP_BASIC
            - DIGEST
            - BEARER
          type: string
          example: NONE
          description: >-
            Authentication method to use for the request. Only applicable for
            HTTP and Keyword monitors
        postValueData:
          type: object
          description: >-
            Data to be sent in the request. Not applicable for HTTP method type
            = HEAD. Can be JSON string or string
        postValueType:
          enum:
            - KEY_VALUE
            - RAW_JSON
          type: string
          description: >-
            Type of data payload to be sent in the request. Affects what data is
            accepted by "postValueData" field
        assignedAlertContacts:
          description: >-
            Alert contacts to be assigned to the monitor. Threshold and
            recurrence are only available in the paid plans, they are always 0
            in the Free Plan
          type: array
          items:
            $ref: '#/components/schemas/AlertContactSettings'
        customHttpHeaders:
          type: object
          description: >-
            Custom HTTP headers to be sent in the request. Must be sent as JSON
            object with key-value pairs. The serialized JSON must not exceed
            3000 characters
        successHttpResponseCodes:
          example:
            - 2xx
            - 3xx
          default: []
          description: >-
            Success HTTP response codes. Can contain specific codes or ranges
            like 2xx. Default is [2xx, 3xx]
          type: array
          items:
            type: string
        checkSSLErrors:
          type: boolean
          description: Whether to check for SSL and domain expiration errors
        tagNames:
          example:
            - tag1
            - tag2
          description: Tags to be assigned to the monitor
          type: array
          items:
            type: string
        maintenanceWindowsIds:
          example:
            - 123
            - 234
          description: Maintenance windows to be assigned to the monitor
          type: array
          items:
            type: number
        domainExpirationReminder:
          type: boolean
          description: Whether to send a notification when the domain is about to expire
        sslExpirationReminder:
          type: boolean
          description: >-
            Whether to send a notification when the SSL certificate is about to
            expire
        followRedirections:
          type: boolean
          description: Whether to follow redirections
        responseTimeThreshold:
          type: number
          minimum: 0
          maximum: 60000
          description: >-
            Response time threshold in milliseconds. When provided, the value is
            applied to all active regions as regionData.THRESHOLD. Always
            returns 0 — use regionData.THRESHOLD for per-region control.
        regionalData:
          type: string
          description: >-
            Region for monitoring: na (North America), eu (Europe), as (Asia),
            oc (Oceania). Note: If both regionalData and regionData are
            provided, regionData takes priority.
          enum:
            - na
            - eu
            - as
            - oc
          example: na
          deprecated: true
        regionData:
          description: >-
            Regional data for monitoring. Omit it, or send it without REGION,
            and the region is assigned automatically (currently NA or EU, one
            region per organization) and never changed on edit.
          allOf:
            - $ref: '#/components/schemas/RegionalDataDto'
        groupId:
          type: number
          minimum: 0
          description: >-
            Monitor group ID to assign the monitor to. Use 0 for the default
            group.
          example: 10
        customFields:
          type: object
          description: >-
            Custom key-value metadata for the monitor. Max 20 keys. Keys:
            alphanumeric + underscore + hyphen, max 64 chars. Values: max 255
            chars. Paid plans only.
          example:
            environment: production
            team: platform
        config:
          nullable: true
          description: >-
            Monitor configuration patch. Accepted keys depend on the monitor
            type - HTTP/Keyword: sslExpirationPeriodDays, ipVersion,
            applicationErrorRetries. API: apiAssertions,
            sslExpirationPeriodDays, ipVersion, applicationErrorRetries. DNS:
            dnsRecords. UDP: udp, ipVersion. PING/PORT: ipVersion. Visual
            Comparison: visualComparison. Third party service:
            thirdPartyService. Heartbeat: none. Top-level shallow merge with
            existing config: omit keys to leave unchanged, set a key to null to
            remove it, or send `config: null` to clear all config.
          allOf:
            - $ref: '#/components/schemas/PermissiveMonitorConfigDto'
