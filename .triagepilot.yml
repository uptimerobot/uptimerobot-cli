# TriagePilot: https://github.com/TriagePilot/triage-pilot/blob/main/docs/github-app/repository-configuration.md
#
# Tiers: score <= 25 low (no human), <= 90 medium (1 reviewer), > 90 high (2 reviewers).
# Every PR also scores 5 per 5 changed non-test files (max 20), +15 for 200+ changed
# lines, +15 for a lockfile change. Path weights add up, each counted once.
#   weight 70  -> 1 reviewer; 2 once the PR is also large (6+ files and 200+ lines) or hits a second risky area
#   no weight  -> small PRs auto-approve
version: 1
mode: enforce

routing:
  high_risk_reviewers: 2
  exclude_source_branch_patterns: ['dependabot/**']

risk:
  thresholds:
    low: 25
    high: 90
  # Defaults to enabled (+10) when omitted.
  ai_authorship:
    enabled: false
  paths:
    - pattern: 'src/lib/{auth,credential-store,redact-secrets,sensitive-fields,invocation}.ts'
      weight: 70
      tag: credentials
    - pattern: 'src/commands/auth/**'
      weight: 70
      tag: credentials
    # Published to npm as @uptimerobot/cli
    - pattern: '{.github/workflows/release.yml,package.json,.npmrc}'
      weight: 70
      tag: publishing
    # Writes files on users' machines; install.ts holds the confirmation prompt
    - pattern: 'src/{lib/skills-installer.ts,commands/skills/install.ts}'
      weight: 70
      tag: skills-installer
    - pattern: 'src/api/**'
      weight: 70
      tag: request-layer
    - pattern: 'src/lib/request*.ts'
      weight: 70
      tag: request-layer
    # Changes who has to review what
    - pattern: '.triagepilot.yml'
      weight: 70
      tag: review-routing
  suppressors:
    - if_all_match:
        [
          'docs/**',
          '**/*.md',
          '**/*.mdx',
          '**/*.test.ts',
          '**/*.test.tsx',
          '**/*.spec.ts',
          '**/*.spec.tsx',
        ]
      ceiling: 15

ownership:
  fallback_reviewers: ['@subalee', '@velzepooz', '@tomas223']
